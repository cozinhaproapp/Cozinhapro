(function(){

  function guardar(r){ if (window.__cpErros.length < 30) { r.em = new Date().toISOString(); window.__cpErros.push(r); } }
  window.addEventListener('error', function(e){
    if (e && e.target && e.target !== window && e.target.src) { guardar({tipo:'recurso', url:String(e.target.src).slice(0,300)}); return; }
    guardar({tipo:'js', msg:e&&e.message, arq:e&&e.filename, lin:e&&e.lineno,
             pilha:(e&&e.error&&e.error.stack)?String(e.error.stack).slice(0,1000):null});
  }, true);
  window.addEventListener('unhandledrejection', function(e){
    var r = e && e.reason;
    guardar({tipo:'promise', msg:(r&&r.message)?r.message:String(r).slice(0,300)});
  });
})();

// v1.07.136: mesmo descompressor gzip usado em app.html (_gzipDescomprimir/
// _sbPayloadDecodificar) — o payload devolvido por login_operador_pin pode vir
// comprimido (quando o último save foi feito pela conta admin) ou puro (quando
// foi um operador PIN); sem isso, o login funcionava mas o app carregava vazio.
async function _gzipDescomprimir(b64) {
  const binario = atob(b64);
  const bytes = new Uint8Array(binario.length);
  for (let i = 0; i < binario.length; i++) bytes[i] = binario.charCodeAt(i);
  const ds = new DecompressionStream('gzip');
  const writer = ds.writable.getWriter();
  writer.write(bytes);
  writer.close();
  const buf = await new Response(ds.readable).arrayBuffer();
  return new TextDecoder().decode(buf);
}
async function _payloadDecodificar(raw) {
  if (raw && raw._gz === true && typeof raw._data === 'string') {
    try { return JSON.parse(await _gzipDescomprimir(raw._data)); }
    catch(e) { console.error('[gzip] falha ao descomprimir payload:', e.message); return null; }
  }
  return raw || null;
}

    if (emailEl) { emailEl.value = convite; emailEl.readOnly = true; }
    const msgEl = document.getElementById('msg');
    if (msgEl) { msgEl.textContent = 'Você foi convidado! Crie sua senha para acessar.'; msgEl.className = 'msg info'; }
  }
})();

// ── Intenção de plano: vem da landing page (?plano=basico/completo) —
// não libera nada além do trial normal, só registra o interesse pra você
// saber quem quer o quê na hora de conversar sobre upgrade.
let _planoDesejado = null;
(function _checarPlanoDesejado() {
  const params = new URLSearchParams(window.location.search);
  const plano = params.get('plano');
  if (plano === 'basico' || plano === 'completo') {
    _planoDesejado = plano;
    setTab('cadastro');
    const msgEl = document.getElementById('msg');
    if (msgEl && !msgEl.textContent) {
      const nomePlano = plano === 'completo' ? 'Gestão' : 'Produção';
      msgEl.textContent = `Você vai começar com 7 dias de teste grátis — depois disso, assine o ${nomePlano} pra continuar.`;
      msgEl.className = 'msg info';
    }
  }
})();

// ── Navegação entre tabs ──────────────────────────────────────────
// v1.07.181: passou a ser genérico. Além das 3 abas existem agora 2 telas do
// fluxo de recuperação que NÃO são abas (não têm botão na barra) — a barra some
// nelas, senão a pessoa clica em "Entrar" no meio da troca de senha, o painel
// some e ela fica sem entender por que a senha não mudou.
//
// As duas listas ficam DENTRO da função de propósito: como const de topo elas
// entravam em zona morta temporal — os blocos _checarConvite/_checarPlanoDesejado
// rodam antes desta linha e chamam setTab, o que estourava ReferenceError e
// matava o resto do script. O convite parava de abrir a aba de cadastro.
function setTab(tab) {
  const _PAINEIS = ['login', 'cadastro', 'pin', 'recuperar', 'nova-senha'];
  const _COM_ABA = ['login', 'cadastro', 'pin'];
  _PAINEIS.forEach(function(p) {
    const el = document.getElementById('panel-' + p);
    if (el) el.style.display = (p === tab) ? '' : 'none';
  });
  _COM_ABA.forEach(function(p) {
    const b = document.getElementById('tab-' + p);
    if (b) b.classList.toggle('active', p === tab);
  });
  const barra = document.querySelector('.tab-row');
  if (barra) barra.style.display = (_COM_ABA.indexOf(tab) === -1) ? 'none' : '';
  clearMsg();
}

async function entrarPin() {
  const codigo = document.getElementById('pin-codigo')?.value.trim().toUpperCase();
  const pin    = document.getElementById('pin-pin')?.value.trim();
  if (!codigo) { showMsg('Informe o código do estabelecimento.'); return; }
  if (!pin || pin.length < 4) { showMsg('PIN deve ter mínimo 4 dígitos.'); return; }
  const btn = document.getElementById('btn-pin');
  if (btn) { btn.disabled = true; btn.textContent = '...'; }
  try {
    // v1.07.173: o PIN viaja em texto sobre HTTPS e é validado com bcrypt dentro
    // do Postgres. O navegador não calcula mais nenhum derivado do PIN — antes,
    // o hash de 32 bits gerado aqui era a credencial permanente do operador e
    // ficava guardado em localStorage, o que tornava os 10.000 PINs possíveis
    // pré-computáveis. Agora a RPC devolve um token de sessão aleatório.
    const resp = await fetch(SUPABASE_URL + '/rest/v1/rpc/login_operador_pin_v2', {
      method: 'POST',
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: 'Bearer ' + SUPABASE_ANON_KEY,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ p_codigo: codigo, p_pin: pin }),
    });

    if (!resp.ok) {
      const err = await resp.json().catch(()=>({}));
      console.error('[PIN RPC]', resp.status, err);
      showMsg('Erro de conexão. Tente novamente.');
      return;
    }

    const result = await resp.json();

    if (!result.ok) {
      showMsg(result.erro || 'Código ou PIN inválido.');
      return;
    }

    // Salvar sessão PIN no localStorage
    const session = {
      operadorId: result.operadorId,
      nome:       result.nome,
      papel:      result.papel,
      permissoes: result.permissoes,
      estabId:    result.estabId,
      estabNome:  result.estabNome,
      token:      result.token,     // credencial de sessão (256 bits) — substitui o pinHash
      expiraEm:   result.expiraEm,  // validade absoluta definida pelo servidor
      loginEm:    new Date().toISOString(),
      _ts:        Date.now(),       // a checagem de 8h no app.html depende deste campo
    };
    localStorage.setItem('cp_pin_session', JSON.stringify(session));

    // v1.07.176: o login não recebe mais o payload do estabelecimento. Ele
    // entregava o state inteiro aqui, o que anularia o isolamento por fatias —
    // o operador teria tudo em localStorage antes mesmo de o filtro agir. O app
    // carrega o state pelas fatias do papel dele logo depois de entrar.
    //
    // O cache local é apagado de propósito: num computador compartilhado ele
    // pode conter o state completo deixado por uma sessão anterior, inclusive
    // a do dono.
    try { localStorage.removeItem('cozinhapro_state'); } catch(e) {}
    localStorage.setItem('cozinhapro_iniciado', '1');

    window.location.href = '/app.html';
  } catch(e) {
    showMsg('Erro ao verificar PIN. Tente novamente.');
    console.error(e);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Entrar'; }
  }
}

// ── Mensagens ─────────────────────────────────────────────────────
function showMsg(text, type='error') {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + type;
}
function clearMsg() {
  const el = document.getElementById('msg');
  el.className = 'msg';
}

function setBusy(id, busy, label) {
  const btn = document.getElementById(id);
  if (!btn) return;
  btn.disabled = busy;
  btn.textContent = busy ? '...' : label;
}

// ── Entrar ────────────────────────────────────────────────────────
async function entrar() {
  const email = document.getElementById('login-email').value.trim();
  const senha = document.getElementById('login-senha').value;
  if (!email || !senha) { showMsg('Preencha email e senha.'); return; }
  setBusy('btn-entrar', true, 'Entrar');
  const { error } = await sb.auth.signInWithPassword({ email, password: senha });
  setBusy('btn-entrar', false, 'Entrar');
  if (error) { showMsg('Email ou senha incorretos.'); return; }
  goToApp();
}

// v1.07.180: quem clica no link de confirmação volta para cá com ?confirmado=1.
// Sem esta mensagem a pessoa cai numa tela de login idêntica à de antes e não
// sabe se deu certo.
(function _avisoConfirmado() {
  if (new URLSearchParams(window.location.search).get('confirmado') !== '1') return;
  setTab('login');
  showMsg('✅ E-mail confirmado. Entre com sua senha para começar.', 'success');
})();

// ── Cadastrar ─────────────────────────────────────────────────────
async function cadastrar() {
  const nome  = document.getElementById('cad-nome').value.trim();
  const email = document.getElementById('cad-email').value.trim();
  const senha = document.getElementById('cad-senha').value;
  const aceite = document.getElementById('cad-aceite').checked;
  if (!email)              { showMsg('Informe o email.'); return; }
  if (senha.length < 6)   { showMsg('Senha mínima de 6 caracteres.'); return; }
  if (!aceite)             { showMsg('Você precisa aceitar os Termos de Uso e a Política de Privacidade para continuar.'); return; }
  setBusy('btn-cadastrar', true, 'Criar conta grátis');
  const { error } = await sb.auth.signUp({
    email, password: senha,
    options: {
      // v1.07.180: sem isto, o link de confirmação joga a pessoa na landing
      // page — ela confirma o e-mail e volta para a página de vendas, sem
      // entrar no sistema. Agora cai na tela de login já avisada.
      emailRedirectTo: window.location.origin + '/login.html?confirmado=1',
      data: { nome: nome || email, termos_aceitos_em: new Date().toISOString(), termos_versao: '1.0', plano_desejado: _planoDesejado }
    }
  });
  setBusy('btn-cadastrar', false, 'Criar conta grátis');
  if (error) { showMsg(error.message); return; }
  showMsg('✅ Conta criada! Verifique seu email para confirmar e depois faça login.', 'success');
  setTab('login');
}

// ── Magic Link ────────────────────────────────────────────────────
async function magicLink() {
  const email = document.getElementById('login-email').value.trim();
  if (!email) { showMsg('Informe o email acima primeiro.'); return; }
  const { error } = await sb.auth.signInWithOtp({
    email,
    options: { emailRedirectTo: window.location.origin + '/app.html' }
  });
  if (error) { showMsg(error.message); return; }
  showMsg('✉️ Link enviado! Verifique seu email.', 'info');
}

// ══ Recuperação de senha (v1.07.181) ════════════════════════
// Até aqui não existia nenhuma forma de recuperar a senha: quem esquecesse
// simplesmente perdia a conta. O template de e-mail já estava pronto, faltava
// a tela que dispara o envio e a tela que recebe a volta do link.
//
// O caminho é: pedirRecuperacao() → e-mail do Supabase → a pessoa volta em
// /login.html?recuperar=1#access_token=... (fluxo implícito) → o cliente
// supabase-js troca isso por uma sessão (detectSessionInUrl) → mostramos o
// painel de nova senha → salvarNovaSenha() chama updateUser.

function _ehFluxoRecuperacao() {
  try {
    if (new URLSearchParams(window.location.search).get('recuperar') === '1') return true;
    const h = (window.location.hash || '').replace(/^#/, '');
    return /(^|&)type=recovery(&|$)/.test(h) || /(^|&)error_code=/.test(h);
  } catch (e) { return false; }
}

function irParaRecuperacao() {
  const atual = (document.getElementById('login-email') || {}).value;
  const alvo  = document.getElementById('rec-email');
  if (alvo && atual && !alvo.value) alvo.value = atual.trim();
  setTab('recuperar');
  setTimeout(function() { if (alvo) alvo.focus(); }, 50);
}

async function pedirRecuperacao() {
  const email = document.getElementById('rec-email').value.trim();
  if (!email || email.indexOf('@') < 1) { showMsg('Informe um e-mail válido.'); return; }
  setBusy('btn-recuperar', true, 'Enviar link de recuperação');
  const { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + '/login.html?recuperar=1'
  });
  setBusy('btn-recuperar', false, 'Enviar link de recuperação');

  if (error) {
    console.error('[recuperar]', error.message);
    // O limite de envio é o único erro que vale mostrar: se ficar escondido
    // atrás da mensagem neutra, a pessoa clica de novo achando que não enviou.
    if (/rate|seconds|security purposes|too many/i.test(error.message || '')) {
      showMsg('Aguarde alguns segundos antes de pedir outro link.');
      return;
    }
  }
  // Mensagem neutra de propósito, mesmo quando o e-mail não existe: confirmar
  // a existência da conta transformaria esta tela num verificador de cadastro
  // — qualquer um poderia descobrir quem é cliente testando endereços.
  showMsg('✉️ Se existir uma conta com esse e-mail, o link já está a caminho. Ele vale por 1 hora.', 'success');
}

async function salvarNovaSenha() {
  const s1 = document.getElementById('ns-senha').value;
  const s2 = document.getElementById('ns-senha2').value;
  if (s1.length < 6) { showMsg('A senha precisa ter no mínimo 6 caracteres.'); return; }
  if (s1 !== s2)     { showMsg('As duas senhas não são iguais.'); return; }

  setBusy('btn-nova-senha', true, 'Salvar nova senha');
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    setBusy('btn-nova-senha', false, 'Salvar nova senha');
    setTab('recuperar');
    showMsg('A sessão de recuperação expirou. Peça um link novo abaixo.');
    return;
  }
  const { error } = await sb.auth.updateUser({ password: s1 });
  setBusy('btn-nova-senha', false, 'Salvar nova senha');
  if (error) {
    console.error('[nova senha]', error.message);
    showMsg(/different|same/i.test(error.message || '')
      ? 'Escolha uma senha diferente da anterior.'
      : 'Não foi possível salvar a senha. Tente novamente.');
    return;
  }
  // Mesmo motivo do login por PIN: num computador compartilhado o cache local
  // pode conter o state de outra conta.
  try { localStorage.removeItem('cozinhapro_state'); } catch (e) {}
  showMsg('✅ Senha alterada. Entrando...', 'success');
  goToApp();
}

(async function _abrirRecuperacao() {
  if (!_ehFluxoRecuperacao()) return;

  const h    = new URLSearchParams((window.location.hash || '').replace(/^#/, ''));
  const erro = h.get('error_code') || h.get('error');
  if (erro) {
    setTab('recuperar');
    showMsg(/expired/i.test(erro)
      ? 'Esse link expirou. Peça um novo abaixo.'
      : 'Não foi possível validar o link. Peça um novo abaixo.');
    return;
  }

  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    setTab('recuperar');
    showMsg('O link não é mais válido. Peça um novo abaixo.');
    return;
  }

  // Tira o token da barra de endereços e do histórico. O ?recuperar=1 fica,
  // porque é ele que segura o auto-redirect se a pessoa recarregar a página.
  try { history.replaceState(null, '', window.location.pathname + '?recuperar=1'); } catch (e) {}

  const alvo = document.getElementById('ns-email');
  if (alvo) alvo.textContent = (session.user && session.user.email) || '';
  setTab('nova-senha');
  showMsg('Link confirmado. Escolha sua nova senha.', 'info');
})();

// ── Redirecionar para o app ───────────────────────────────────────
// ESTRUTURA FUTURA:
// login.html → autentica → redireciona para app.html
// index.html → landing page → botão "Entrar" → login.html
// Por enquanto: login redireciona para index.html (que é o app)
function goToApp() {
  // Pequeno delay para garantir que a sessão foi gravada no localStorage
  // antes de redirecionar para o app
  setTimeout(() => {
    window.location.href = '/app.html';
  }, 500);
}
</script>
