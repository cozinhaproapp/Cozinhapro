<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #1C1A17;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    overflow: hidden;
  }

  /* Fundo decorativo */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(200,131,42,0.12) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(200,131,42,0.08) 0%, transparent 50%);
    pointer-events: none;
  }

  .login-card {
    background: #F5F0E8;
    border-radius: 20px;
    padding: 44px 40px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 24px 80px rgba(0,0,0,0.5);
    position: relative;
    z-index: 1;
  }

  .login-logo {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    margin-bottom: 32px;
  }

  .login-logo img {
    width: 80px;
    height: 80px;
    object-fit: contain;
    border-radius: 18px;
  }

  .login-logo h1 {
    font-size: 1.6rem;
    font-weight: 800;
    color: #1C1A17;
    letter-spacing: -0.5px;
  }

  .login-logo p {
    font-size: 0.82rem;
    color: #888;
    text-align: center;
    line-height: 1.4;
  }

  .tab-row {
    display: flex;
    gap: 0;
    background: #E8E2D8;
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 24px;
  }

  .tab-btn {
    flex: 1;
    padding: 8px;
    border: none;
    background: none;
    border-radius: 8px;
    font-size: 0.82rem;
    font-weight: 600;
    color: #888;
    cursor: pointer;
    transition: all 0.2s;
  }

  .tab-btn.active {
    background: white;
    color: #1C1A17;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }

  .form-group {
    margin-bottom: 16px;
  }

  .form-label {
    display: block;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #666;
    margin-bottom: 6px;
  }

  .form-input {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid #D8D2C8;
    border-radius: 10px;
    font-size: 0.95rem;
    background: white;
    color: #1C1A17;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
  }

  .form-input:focus {
    border-color: #C8832A;
    box-shadow: 0 0 0 3px rgba(200,131,42,0.15);
  }

  .btn-primary {
    width: 100%;
    padding: 13px;
    background: #C8832A;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    margin-top: 8px;
  }

  .btn-primary:hover { background: #A0621A; }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled { background: #ccc; cursor: not-allowed; }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 0;
    color: #bbb;
    font-size: 0.75rem;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #D8D2C8;
  }

  .btn-magic {
    width: 100%;
    padding: 11px;
    background: none;
    border: 1.5px solid #D8D2C8;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 600;
    color: #555;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-magic:hover { border-color: #C8832A; color: #C8832A; }

  .msg {
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 0.82rem;
    margin-bottom: 16px;
    display: none;
    line-height: 1.4;
  }
  .msg.error   { background: #FEE2E2; color: #C03030; display: block; }
  .msg.success { background: #D1FAE5; color: #065F46; display: block; }
  .msg.info    { background: #EEF6FF; color: #1E40AF; display: block; }

  .footer-link {
    text-align: center;
    margin-top: 24px;
    font-size: 0.75rem;
    color: #999;
  }

  .footer-link a {
    color: #C8832A;
    text-decoration: none;
    font-weight: 600;
  }

  /* ── Landing Page placeholder ─────────────────────────────────
     Quando a landing page for criada (index.html separado),
     remover este bloco e criar arquivo próprio.
     O login se tornará login.html e o app será app.html.
     Por enquanto, login e app coexistem no mesmo fluxo.
  ── */
  .lp-hint {
    display: none; /* ativar quando landing page estiver pronta */
  }

  @media (max-width: 480px) {
    .login-card { padding: 32px 24px; border-radius: 16px; }
    .login-logo h1 { font-size: 1.4rem; }
  }
</style>
</head>

<script>
const SUPABASE_URL      = 'https://rqsrwgtprclvbicurqzn.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJxc3J3Z3RwcmNsdmJpY3VycXpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNzAwMzksImV4cCI6MjA5NTY0NjAzOX0.ufJ2xClTEKCrZ6XSk_tfn8V2EKj0VFw3vpbML4TLd9A';

// v1.07.136: mesmo descompressor gzip usado em app.html (_gzipDescomprimir/
// _sbPayloadDecodificar) — o payload devolvido por login_operador_pin pode vir
// comprimido (quando o último save foi feito pela conta admin) ou puro (quando
// foi um operador PIN); sem isso, o login funcionava mas o app carregava vazio.
async function _gzipDescomprimir(b64) {
  const binario = atob(b64);
  const bytes = new Uint8Array(binario.length);
  for (let i = 0; i < binario.length; i++) bytes[i] = binario.charCodeAt(i);
  const ds = new DecompressionStream('gzip');
  const writer = ds.writable.getWriter();
  writer.write(bytes);
  writer.close();
  const buf = await new Response(ds.readable).arrayBuffer();
  return new TextDecoder().decode(buf);
}
async function _payloadDecodificar(raw) {
  if (raw && raw._gz === true && typeof raw._data === 'string') {
    try { return JSON.parse(await _gzipDescomprimir(raw._data)); }
    catch(e) { console.error('[gzip] falha ao descomprimir payload:', e.message); return null; }
  }
  return raw || null;
}
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: {
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: true,
    storageKey: 'cozinhapro-auth',
  }
});

})();

})();

// ── Intenção de plano: vem da landing page (?plano=basico/completo) —
// não libera nada além do trial normal, só registra o interesse pra você
// saber quem quer o quê na hora de conversar sobre upgrade.
let _planoDesejado = null;
(function _checarPlanoDesejado() {
  const params = new URLSearchParams(window.location.search);
  const plano = params.get('plano');
  if (plano === 'basico' || plano === 'completo') {

      msgEl.textContent = `Você vai começar com 7 dias de teste grátis — depois disso, assine o ${nomePlano} pra continuar.`;

})();

// ── Navegação entre tabs ──────────────────────────────────────────
function setTab(tab) {
  document.getElementById('panel-login').style.display    = tab === 'login'    ? '' : 'none';
  document.getElementById('panel-cadastro').style.display = tab === 'cadastro' ? '' : 'none';
  document.getElementById('panel-pin').style.display      = tab === 'pin'      ? '' : 'none';
  document.getElementById('tab-login').classList.toggle('active',    tab === 'login');
  document.getElementById('tab-cadastro').classList.toggle('active', tab === 'cadastro');
  document.getElementById('tab-pin').classList.toggle('active',      tab === 'pin');
  clearMsg();
}

async function entrarPin() {
  const codigo = document.getElementById('pin-codigo')?.value.trim().toUpperCase();
  const pin    = document.getElementById('pin-pin')?.value.trim();
  if (!codigo) { showMsg('Informe o código do estabelecimento.'); return; }
  if (!pin || pin.length < 4) { showMsg('PIN deve ter mínimo 4 dígitos.'); return; }
  const btn = document.getElementById('btn-pin');
  if (btn) { btn.disabled = true; btn.textContent = '...'; }
  try {
    // Hash do PIN (igual ao gerado no sistema)
    function hashPin(p) { let h=0; for(let i=0;i<p.length;i++) h=(Math.imul(31,h)+p.charCodeAt(i))|0; return 'pin_'+Math.abs(h).toString(36); }

    // Chamar RPC com SECURITY DEFINER — bypassa RLS, roda no banco com segurança
    const resp = await fetch(SUPABASE_URL + '/rest/v1/rpc/login_operador_pin', {
      method: 'POST',
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: 'Bearer ' + SUPABASE_ANON_KEY,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ p_codigo: codigo, p_pin_hash: hashPin(pin) }),
    });

    if (!resp.ok) {
      const err = await resp.json().catch(()=>({}));
      console.error('[PIN RPC]', resp.status, err);
      showMsg('Erro de conexão. Tente novamente.');
      return;
    }

    const result = await resp.json();

    if (!result.ok) {
      showMsg(result.erro || 'Código ou PIN inválido.');
      return;
    }

    // Salvar sessão PIN no localStorage
    const session = {
      operadorId: result.operadorId,
      nome:       result.nome,
      papel:      result.papel,
      permissoes: result.permissoes,
      estabId:    result.estabId,
      estabNome:  result.estabNome,
      pinHash:    hashPin(pin), // guardado para validar saves remotos
      loginEm:    new Date().toISOString(),
    };
    localStorage.setItem('cp_pin_session', JSON.stringify(session));

    // Salvar state do estabelecimento no localStorage (carregado pelo RPC)
    // v1.07.136: descomprime antes de checar/usar — ver _payloadDecodificar acima.
    const payloadState = await _payloadDecodificar(result.payload);
    if (payloadState && Object.keys(payloadState).length > 0) {
      const stateComTs = { ...payloadState, _salvoEm: new Date().toISOString() };
      try { localStorage.setItem('cozinhapro_state', JSON.stringify(stateComTs)); } catch(e) {}
      if (payloadState.onboardingCompleto) {
        localStorage.setItem('cozinhapro_iniciado', '1');
      }
    }

    window.location.href = '/app.html';
  } catch(e) {
    showMsg('Erro ao verificar PIN. Tente novamente.');
    console.error(e);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Entrar'; }
  }
}

// ── Mensagens ─────────────────────────────────────────────────────
function showMsg(text, type='error') {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + type;
}
function clearMsg() {
  const el = document.getElementById('msg');
  el.className = 'msg';
}

function setBusy(id, busy, label) {
  const btn = document.getElementById(id);
  if (!btn) return;
  btn.disabled = busy;
  btn.textContent = busy ? '...' : label;
}

// ── Entrar ────────────────────────────────────────────────────────
async function entrar() {
  const email = document.getElementById('login-email').value.trim();
  const senha = document.getElementById('login-senha').value;
  if (!email || !senha) { showMsg('Preencha email e senha.'); return; }
  setBusy('btn-entrar', true, 'Entrar');
  const { error } = await sb.auth.signInWithPassword({ email, password: senha });
  setBusy('btn-entrar', false, 'Entrar');
  if (error) { showMsg('Email ou senha incorretos.'); return; }
  goToApp();
}

// ── Cadastrar ─────────────────────────────────────────────────────
async function cadastrar() {
  const nome  = document.getElementById('cad-nome').value.trim();
  const email = document.getElementById('cad-email').value.trim();
  const senha = document.getElementById('cad-senha').value;
  const aceite = document.getElementById('cad-aceite').checked;
  if (!email)              { showMsg('Informe o email.'); return; }
  if (senha.length < 6)   { showMsg('Senha mínima de 6 caracteres.'); return; }
  if (!aceite)             { showMsg('Você precisa aceitar os Termos de Uso e a Política de Privacidade para continuar.'); return; }
  setBusy('btn-cadastrar', true, 'Criar conta grátis');
  const { error } = await sb.auth.signUp({
    email, password: senha,
    options: { data: { nome: nome || email, termos_aceitos_em: new Date().toISOString(), termos_versao: '1.0', plano_desejado: _planoDesejado } }
  });
  setBusy('btn-cadastrar', false, 'Criar conta grátis');
  if (error) { showMsg(error.message); return; }
  showMsg('✅ Conta criada! Verifique seu email para confirmar e depois faça login.', 'success');
  setTab('login');
}

// ── Magic Link ────────────────────────────────────────────────────
async function magicLink() {
  const email = document.getElementById('login-email').value.trim();
  if (!email) { showMsg('Informe o email acima primeiro.'); return; }
  const { error } = await sb.auth.signInWithOtp({
    email,
    options: { emailRedirectTo: window.location.origin + '/' }
  });
  if (error) { showMsg(error.message); return; }
  showMsg('✉️ Link enviado! Verifique seu email.', 'info');
}

// ── Redirecionar para o app ───────────────────────────────────────
// ESTRUTURA FUTURA:
// login.html → autentica → redireciona para app.html
// index.html → landing page → botão "Entrar" → login.html
// Por enquanto: login redireciona para index.html (que é o app)
function goToApp() {
  // Pequeno delay para garantir que a sessão foi gravada no localStorage
  // antes de redirecionar para o app
  setTimeout(() => {
    window.location.href = '/app.html';
  }, 500);
}
</script>
